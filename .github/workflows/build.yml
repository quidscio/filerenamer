name: Test and build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test and build wheel
        run: python build.py
      - name: Install wheel and test installed command outside the checkout
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          filerenamer --help
          python -m filerenamer --help
          python "${GITHUB_WORKSPACE}/tests/smoke_installed.py"
